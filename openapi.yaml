  - name: Outreach
    tags:
      - Automations
      - Flow Versions
      - Tasks
      - Sender Profiles
  - name: AI
    tags:
      - AI Agents
      - AI Templates
  - name: Messaging
    tags:
      - LinkedIn Messages
