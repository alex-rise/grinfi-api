        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Message retry initiated.
        '404':
          description: Message not found.
  /flows/api/tasks/group-counts:
    post:
      summary: Group counts for tasks
      description: >
        Return task counts **broken down by a field**, in a single request — the efficient
        way to get per-campaign, per-sender or per-type activity without one call per slice.


        `group_field` chooses the breakdown; `filter` (same fields as
        [`List tasks`](#operation/listTasks), composable) narrows what's counted. Response
        is a map of `group value → count`.


        Common queries:

        - Connections sent per campaign (one call):
          `{ "group_field": "flow_uuid", "filter": { "type": "linkedin_send_connection_request", "status": "closed" } }`
        - One campaign's full action breakdown:
          `{ "group_field": "type", "filter": { "flow_uuid": "…", "status": "closed" } }`
        - Scope any of the above to a date range by adding
          `"executed_at": { ">=": "2026-07-01", "<=": "2026-08-01" }` to the filter.


        Grouping is by a **field**, not by day — for a per-day series, loop date windows on
        the `executed_at` filter.
      operationId: groupCountTasks
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_field]
              properties:
                group_field:
                  type: string
                  enum: [flow_uuid, sender_profile_uuid, type, status]
                  description: Field to break the counts down by.
                filter:
                  type: object
                  description: >
                    Optional filter, same fields as `List tasks` (`flow_uuid`, `type`,
                    `status`, `sender_profile_uuid`, `executed_at` range, …), composable.
            example:
              group_field: flow_uuid
              filter:
                type: linkedin_send_connection_request
                status: closed
      responses:
        '200':
          description: Map of group value → count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
              example:
                8bc693be-acc2-4897-968a-fcd09fa74bd5: 870
                f64f42a1-e33c-4c15-988b-2b3b7d803277: 5098
        '422':
          description: Validation error — `group_field` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/linkedin-messages/group-counts:
    post:
      summary: Group counts for LinkedIn messages
      description: >
        Return LinkedIn-message counts **broken down by a field**, in one request. This is
        the right way to get per-sender messaging activity — including **replies per sender**
        (`group_field: sender_profile_uuid` + `filter.type: inbox`).


        `filter` is composable (same fields as the message list). Date scoping uses
        **`sent_at`** with operators (e.g. `"sent_at": { ">=": "2026-07-01" }`); note the
        field is `sent_at`, not `created_at`.
      operationId: groupCountLinkedinMessages
      tags:
        - LinkedIn Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_field]
              properties:
                group_field:
                  type: string
                  enum: [status, type, sender_profile_uuid, linkedin_account_uuid]
                  description: >
                    Field to group by. `type` → `outbox` (sent) / `inbox` (replies);
                    `status` → `done` / `failed` / `new`; `sender_profile_uuid` /
                    `linkedin_account_uuid` → counts per sender / per LinkedIn account.
                filter:
                  type: object
                  description: >
                    Optional filter, composable. Supports `type` (`inbox`/`outbox`),
                    `status`, `sender_profile_uuid`, `lead_uuid`, and a `sent_at` date range.
            example:
              group_field: sender_profile_uuid
              filter:
                type: inbox
      responses:
        '200':
          description: Map of group value → count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
              example:
                e87e2f2e-625c-45cf-a859-6c8c5fb2ae4b: 2707
                66b8ead6-55d5-483d-b516-847403026c3e: 1840
        '422':
          description: Validation error — `group_field` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
