    webhook-payload:
      type: object
      description: >
        Body delivered to your `target_url` when a webhook fires (POST by default). All
        events share the same envelope; `event_name` tells you which fired, and one
        event-specific object (`linkedin_connection`, `linkedin_message`, `email`, …) is
        included for the relevant event. Objects are populated as far as the contact's data
        allows; unknown fields are `null`. Use `contact.uuid` to fetch full contact details
        via [`GET /leads/api/leads/{uuid}`](#operation/getLead).
      properties:
        event_name:
          type: string
          description: The event that fired (see `createWebhook` for the full list).
          example: sender_profile_sent_email
        contact:
          type: object
          description: >
            The contact. Includes identifiers and enrichment: `uuid`, `first_name`,
            `last_name`, `name`, `position`, `headline`, `company_name`, `company_uuid`,
            `linkedin_url`, `linkedin`, `sales_navigator_url`, `ln_id`, `sn_id`,
            `work_email`, `personal_email`, `pipeline_stage_uuid`, `pipeline_stage_name`,
            `list_name`, `tags`, `status`, `getsales_url`, and more.
        account:
          type: object
          description: The contact's company (name, domain, website, industry, linkedin_url, size, etc.).
        sender_profile:
          type: object
          description: >
            The sender profile that performed the action. Present on all events (including
            the `contact_accepted_...` events). Fields: `uuid`, `first_name`, `last_name`,
            `label`, `assignee_user_id`, `team_id`.
        automation:
          type: object
          description: The automation (flow) involved — `uuid`, `name`, `status`, `priority`.
        contact_markers:
          type: object
          description: >
            Aggregate activity timestamps/counters for the contact, e.g.
            `linkedin_last_connection_sent_at`, `linkedin_last_connection_accepted_at`,
            `linkedin_messages_sent_count`, `email_sent_count`, `last_messaging_activity_at`.
        linkedin_connection:
          type: object
          nullable: true
          description: On `contact_accepted_linkedin_connection_request` — `full_name`, `nickname`, `connected_at`.
        linkedin_connection_request:
          type: object
          nullable: true
          description: On `sender_profile_sent_linkedin_connection_request` — `ln_id`, `nickname`, `sent_at`.
        linkedin_message:
          type: object
          nullable: true
          description: On LinkedIn message/inmail events — `subject`, `text`, `type`, `status`, `sent_at`, `read_at`.
        email:
          type: object
          nullable: true
          description: On email events — subject, body, status and timestamps for the email.
        latest_linkedin_conversation_thread:
          type: object
          nullable: true
        latest_email_conversation_thread:
          type: object
          nullable: true
      example:
        event_name: sender_profile_sent_email
        contact:
          uuid: 00000000-0000-0000-0000-000000000001
          name: Example Name
          linkedin_url: https://www.linkedin.com/in/example
          work_email: work@example.com
          pipeline_stage_name: Opportunity
        sender_profile:
          uuid: 00000000-0000-0000-0000-000000000001
          label: Example-Label
        automation:
          uuid: 00000000-0000-0000-0000-000000000001
          name: Example Flow
          status: 'on'
    webhook:
      type: object
      description: A webhook configuration.
      properties:
        uuid:
          type: string
          example: b27f3cfc-84a0-4fb8-956b-91d032f9c523
        team_id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
          example: New Reply Handler
        event:
          type: string
          description: >
            Event that triggers the webhook. Supported events:
            `contact_replied_email`, `contact_replied_linkedin_message`,
            `contact_exported`, `contact_enriched`.
          enum:
            - contact_replied_email
            - contact_replied_linkedin_message
            - contact_exported
            - contact_enriched
          example: contact_replied_linkedin_message
        request_method:
          type: string
          description: HTTP method for the outgoing request.
          example: POST
        target_url:
          type: string
          format: uri
          example: https://hook.eu2.make.com/abc123
        filters:
          type: object
          nullable: true
          description: >
            Optional filter criteria to narrow which contacts trigger the
            webhook. Uses `jsonLogic`, `elasticQuery`, and
            `filter_tree_format` keys.
        status:
          type: string
          description: Webhook status.
          enum: ['on', 'off']
          example: 'on'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
