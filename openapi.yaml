          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  # ============================================================
  # AUTOMATIONS
  # ============================================================
  /flows/api/flows:
    get:
      summary: List automations
      description: >
        Retrieve all outreach automations in your account. Automations are multi-step
        sequences that send LinkedIn messages, emails, and other actions on a schedule.
      operationId: listFlows
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/order-field'
        - $ref: '#/components/parameters/order-type'
        - in: query
          name: filter
          schema:
            type: object
            properties:
              q:
                type: string
                nullable: true
                description: Search by automation name.
              status:
                $ref: '#/components/schemas/mixed-filter-type'
          description: Filters.
      responses:
        '200':
          description: Paginated list of automations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/flow'
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 15
                  has_more:
                    type: boolean
    post:
      summary: Create an automation
      description: >
        Create a new outreach automation (flow) programmatically. The automation is
        created in `draft` status with no node tree yet — add the workflow steps in a
        second call to
        [`POST /flows/api/flows/{flowUuid}/flow-versions`](#operation/createFlowVersion),
        then activate it with
        [`PUT /flows/api/flows/{flowUuid}/start`](#operation/startFlow).


        This is the entry point for building automations without the web editor.
        Typical agent-driven sequence:

        1. `POST /flows/api/flows` — create the shell (this endpoint).
        2. `POST /flows/api/flows/{flowUuid}/flow-versions` — save the node tree.
        3. `PUT /flows/api/flows/{flowUuid}/start` — go live.
      operationId: createFlow
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, use_sender_schedule, schedule]
              properties:
                name:
                  type: string
                  description: Automation name.
                  example: DACH CTO Outreach
                use_sender_schedule:
                  type: boolean
                  description: >
                    When `true`, each step runs on its sender profile's own working-hours
                    schedule and the `schedule` object below is ignored at runtime (but is
                    still required in the request). When `false`, the flow `schedule` applies.
                  example: false
                schedule:
                  $ref: '#/components/schemas/schedule'
                description:
                  type: string
                  nullable: true
                priority:
                  type: integer
                  description: Execution priority (higher runs first). Defaults to 2.
                  example: 2
                is_public:
                  type: boolean
                  description: Whether the automation is visible to the whole team.
                flow_workspace_uuid:
                  type: string
                  nullable: true
                  description: UUID of the folder (workspace) to place the automation in.
            example:
              name: DACH CTO Outreach
              use_sender_schedule: false
              schedule:
                timezone: Europe/Berlin
                use_lead_timezone: false
                timeblocks:
                  - { dow: 1, min: 540, max: 1080 }
                  - { dow: 2, min: 540, max: 1080 }
                  - { dow: 3, min: 540, max: 1080 }
                  - { dow: 4, min: 540, max: 1080 }
                  - { dow: 5, min: 540, max: 1080 }
      responses:
        '201':
          description: Automation created (in `draft` status, no node tree yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flows/{flowUuid}:
    get:
      summary: Get an automation
      description: Retrieve full details of an automation by UUID.
      operationId: getFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: Automation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
        '404':
          description: Automation not found.
    put:
      summary: Update an automation
      description: Update an automation's name, description, or schedule.
      operationId: updateFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Campaign Name
                description:
                  type: string
                schedule:
                  $ref: '#/components/schemas/schedule'
      responses:
        '200':
          description: Updated automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
    delete:
      summary: Delete an automation
      description: Permanently delete an automation. This cannot be undone.
      operationId: deleteFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '204':
          description: Automation deleted.
  /flows/api/flows/{flowUuid}/start:
    put:
      summary: Start an automation
      description: >
        Activate an automation so it begins processing contacts and executing
        outreach steps on its schedule.
      operationId: startFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: Automation started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
        '422':
          description: Cannot start (e.g., archived automation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flows/{flowUuid}/stop:
    put:
      summary: Stop an automation
      description: Pause an automation. Contacts already in progress will finish their current step.
      operationId: stopFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: Automation stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
  /flows/api/flows/{flowUuid}/archive:
    put:
      summary: Archive an automation
      description: Archive an automation. Archived automations cannot be started.
      operationId: archiveFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: Automation archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
  /flows/api/flows/{flowUuid}/unarchive:
    put:
      summary: Unarchive an automation
      description: Restore an archived automation so it can be started again.
      operationId: unarchiveFlow
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: Automation unarchived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
  /flows/api/flows/clone:
    post:
      summary: Clone an automation
      description: >
        Create a copy of an existing automation with a new name.
        The cloned automation will be in a stopped state.
      operationId: cloneFlow
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_uuid, name]
              properties:
                flow_uuid:
                  type: string
                  description: UUID of the automation to clone.
                name:
                  type: string
                  example: Campaign Q2 - Copy
                flow_workspace_uuid:
                  type: string
      responses:
        '201':
          description: Cloned automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow'
  /flows/api/flows/{flowUuid}/statistics/nodes:
    post:
      summary: Automation node statistics (funnel)
      description: >
        Per-step funnel for an automation — **the accurate per-campaign engagement source,
        matching the web app**. For each node you get how many contacts reached each status
        and the real conversions at that step.


        Prefer this over counting `trigger_..._accepted` tasks for acceptance/reply numbers:
        the trigger-task count is inflated in follow-up campaigns (contacts that entered
        already connected), whereas `node_conversions.accepted` here is the true count.
        Acceptance rate = `node_conversions.accepted / node_statuses.closed` on the
        connection-request node; replies per message node = `node_conversions.replied`.


        **`node_ids` is required** — the integer ids of the nodes to report on (from
        [`GET /flows/api/flows/{flowUuid}`](#operation/getFlow) → the active version's
        `nodes[].id`). Add a `filter` (e.g. an `executed_at`/date range) to scope the period.
      operationId: getFlowNodeStatistics
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_ids]
              properties:
                node_ids:
                  type: array
                  description: Integer node ids to report on.
                  items:
                    type: integer
                filter:
                  type: object
                  nullable: true
                  description: Optional date-range / contact filter to scope the counts.
            example:
              node_ids: [2, 3, 6]
      responses:
        '200':
          description: >
            Map of `node_id` → statistics. `node_statuses` counts contacts by task status;
            `node_conversions` holds the real outcomes (`accepted`, `replied`, `opened`,
            `blocked`) — an empty array for nodes that have none; `node_branches` (on
            rule/trigger nodes) counts how many took each branch.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    node_statuses:
                      type: object
                      additionalProperties:
                        type: integer
                    node_conversions:
                      description: "Object of outcome → count, or `[]` when the node has none."
                      oneOf:
                        - type: object
                          additionalProperties:
                            type: integer
                        - type: array
                    node_branches:
                      type: object
                      additionalProperties:
                        type: integer
              example:
                '2':
                  node_statuses: { closed: 3304, skipped: 1286, canceled: 2088, failed: 44, in_progress: 44 }
                  node_conversions: { accepted: 530, replied: 65 }
                '3':
                  node_statuses: { closed: 679, restarted: 1068, canceled: 558, failed: 43, in_progress: 20 }
                  node_conversions: { replied: 42, opened: 199, blocked: 1 }
        '422':
          description: Validation error — `node_ids` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flows/{flowUuid}/statistics/contact-sources:
    post:
      summary: Automation contact-source statistics
      description: >
        Funnel broken down by **contact source** (audience) of an automation, with a
        per-channel conversion breakdown. Use it to compare how different audiences of the
        same flow perform.


        `contact_source_ids` are the integer ids from the flow version's `contact_sources`
        (see [`GET /flows/api/flows/{flowUuid}`](#operation/getFlow)).
      operationId: getFlowContactSourceStatistics
      tags:
        - Automations
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_source_ids]
              properties:
                contact_source_ids:
                  type: array
                  items:
                    type: integer
            example:
              contact_source_ids: [1, 2]
      responses:
        '200':
          description: >
            Map of `contact_source_id` → statistics: `contact_source_statuses`,
            `contact_source_added_by` (`user` / `filter`), and `contact_source_conversions`
            with a per-channel breakdown (`linkedin_connection_request`, `linkedin_message`,
            `email`, …) carrying `sent` / `accepted` / `opened` / `replied` / `blocked`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
              example:
                '1':
                  contact_source_statuses: { restarted: 695, canceled: 3042, failed: 64, finished: 274, in_progress: 194 }
                  contact_source_added_by: { user: 3574, filter: 0 }
                  contact_source_conversions:
                    linkedin_connection_request: { sent: 1534, accepted: 204 }
                    linkedin_message: { sent: 590, opened: 216, replied: 68, blocked: 1 }
                    email: { sent: 0, opened: 0, replied: 0 }
        '422':
          description: Validation error — `contact_source_ids` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flows-leads/list:
    post:
      summary: List flow contacts
      description: >
        Search contacts enrolled in automations. Returns flow-lead records that link
        a contact to a flow with status, current node, and timing fields.
      operationId: listFlowLeads
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  properties:
                    flow_uuid:
                      type: array
                      items:
                        type: string
                        format: uuid
                    lead_uuid:
                      type: array
                      items:
                        type: string
                        format: uuid
                    status:
                      type: array
                      items:
                        type: string
                limit:
                  type: integer
                  default: 20
                offset:
                  type: integer
                  default: 0
            example:
              filter:
                flow_uuid:
                  - 3a4ac30b-1321-449c-9b37-e9fe3174e00e
              limit: 20
              offset: 0
      responses:
        '200':
          description: Paginated flow-lead records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  has_more:
                    type: boolean
  /flows/api/flows/leads/{leadUuid}:
    delete:
      summary: Remove contact's flow history
      description: >
        Permanently delete all flow-lead records for a contact across all automations.
        This removes the enrollment history; the contact itself is not deleted.
      operationId: deleteFlowLeadHistory
      tags:
        - Automations
      parameters:
        - in: path
          name: leadUuid
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID.
      responses:
        '204':
          description: Flow history removed.
        '404':
          description: Contact not found or no records.
  # ============================================================
  # FLOW VERSIONS
  # ============================================================
  /flows/api/flows/{flowUuid}/flow-versions:
    get:
      summary: List flow versions
      description: List all versions saved for a flow. Each version is an immutable snapshot.
      operationId: listFlowVersions
      tags:
        - Flow Versions
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      responses:
        '200':
          description: List of flow versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                    flow_uuid:
                      type: string
                      format: uuid
                    nodes:
                      type: array
                    contact_sources:
                      type: array
                    created_at:
                      type: string
                      format: date-time
    post:
      summary: Create a flow version
      description: >
        Save a new version (snapshot) of the flow's node tree and contact sources.
        Versions are immutable; activating a different version replaces the running config.
      operationId: createFlowVersion
      tags:
        - Flow Versions
      parameters:
        - $ref: '#/components/parameters/flowUuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes, contact_sources]
              properties:
                nodes:
                  type: array
                  description: >
                    The node tree — an ordered list of steps connected by `before`/`after`
                    edges. See the [`flow-node`](#schema/flow-node) schema for the shape of
                    each node and the payload of every node `type`. Every branch must
                    terminate in an [`end`](#schema/flow-node) node — a flow can have
                    several. Branches that reconverge do so before ending; set
                    `first_common_node_id` to the reconvergence node. **Every node must
                    include `created_at` and `updated_at` timestamps** (unlike
                    `validate-node`, which does not require them).
                  items:
                    $ref: '#/components/schemas/flow-node'
                contact_sources:
                  type: array
                  minItems: 1
                  description: >
                    Who enters the flow. See the [`contact-source`](#schema/contact-source)
                    schema. **Must contain at least one source** — an empty array is
                    rejected with a `422` ("The contact sources field is required.",
                    verified on prod 2026-07-05). For a version with no audience yet,
                    send one default source with `sender_profiles: []` and `after_id`
                    pointing at the tree's entry node — the same shape the backend
                    auto-creates with a new flow shell (see `KNOWN_ISSUES.md` §4).
                  items:
                    $ref: '#/components/schemas/contact-source'
                first_common_node_id:
                  type: integer
                  nullable: true
                  description: >
                    ID of the first node where all branches reconverge. Set by the web
                    editor for layout; may be `null` for linear trees. Include it when
                    round-tripping a version you read back from the API.
            example:
              first_common_node_id: null
              contact_sources:
                - id: 1
                  name: null
                  rotation_strategy: fair
                  sender_profiles: []
                  after_id: 3
                  mass_actions_filter: null
                  filter_tree_format: null
              nodes:
                - id: 3
                  before: []
                  after: [{ node_id: 5, branch_id: 1 }]
                  type: linkedin_send_connection_request
                  automation: auto
                  payload:
                    template: "Hi {{first_name}}, happy to connect!"
                    fallback_send: true
                    template_uuid: null
                  delay_in_seconds: 0
                  created_at: "2026-07-05T10:00:00.000000Z"
                  updated_at: "2026-07-05T10:00:00.000000Z"
                - id: 5
                  before: [{ node_id: 3, branch_id: 1 }]
                  after: [{ node_id: 1, branch_id: 1 }]
                  type: linkedin_send_message
                  automation: auto
                  payload:
                    template: "Thanks for connecting! ..."
                    attachments: []
                    template_uuid: null
                    stop_on_reply_level: always
                  delay_in_seconds: 7200
                  created_at: "2026-07-05T10:00:00.000000Z"
                  updated_at: "2026-07-05T10:00:00.000000Z"
                - id: 1
                  before: [{ node_id: 5, branch_id: 1 }]
                  after: []
                  type: end
                  automation: auto
                  payload: []
                  delay_in_seconds: 0
                  created_at: "2026-07-05T10:00:00.000000Z"
                  updated_at: "2026-07-05T10:00:00.000000Z"
      responses:
        '201':
          description: Flow version created.
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flow-versions/{uuid}:
    get:
      summary: Get a flow version
      description: Retrieve a specific flow version by UUID.
      operationId: getFlowVersion
      tags:
        - Flow Versions
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Flow version details.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found.
    delete:
      summary: Delete a flow version
      description: Permanently delete a flow version. Active versions cannot be deleted.
      operationId: deleteFlowVersion
      tags:
        - Flow Versions
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Deleted.
        '404':
          description: Not found.
  /flows/api/flow-versions/validate-node:
    post:
      summary: Validate a flow node
      description: >
        Validate a single node configuration without saving it. Useful for pre-flight
        checks when building a flow programmatically. Send the **same node object shape**
        you would put inside a flow version (see the
        [`flow-node`](#schema/flow-node) schema).


        **Required fields:** `id`, `type`, `before`, `after`. The `before` and `after`
        edge arrays MUST be present even when empty (`[]`) — omitting them currently
        causes a server error instead of a validation error.


        **`id` must be an integer**, not a string. Node config lives in the `payload`
        object, with `automation` set to the string `"auto"`.


        A valid node returns **`204 No Content`** (empty body).
      operationId: validateFlowNode
      tags:
        - Flow Versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flow-node'
            example:
              id: 1
              before: []
              after: []
              type: linkedin_send_connection_request
              automation: auto
              payload:
                template: "Hi {{first_name}}, happy to connect!"
                fallback_send: true
                template_uuid: null
              delay_in_seconds: 0
      responses:
        '204':
          description: Node configuration is valid (empty body).
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/flow-versions/validate-contact-source:
    post:
      summary: Validate a contact source
      description: Validate a contact source configuration without saving it.
      operationId: validateContactSource
      tags:
        - Flow Versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: Contact source ID (integer).
                  example: 1
                type:
                  type: string
                  example: manual
                options:
                  type: object
            example:
              id: 1
              type: manual
              options: {}
      responses:
        '200':
          description: Contact source is valid.
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  # ============================================================
  # FLOW WORKSPACES
  # ============================================================
  /flows/api/flow-workspaces:
    get:
      summary: List automation folders
      description: List all automation folders (workspaces) for organizing automations.
      operationId: listFlowWorkspaces
      tags:
        - Automations
      responses:
        '200':
          description: Paginated list of automation folders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/flow-workspace'
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 5
                  has_more:
                    type: boolean
    post:
      summary: Create automation folder
      operationId: createFlowWorkspace
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Q2 Campaigns
                order:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Automation folder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow-workspace'
  /flows/api/flow-workspaces/{uuid}:
    put:
      summary: Update automation folder
      operationId: updateFlowWorkspace
      tags:
        - Automations
      parameters:
