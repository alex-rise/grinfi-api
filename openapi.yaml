  # ============================================================
  # ACTIVITIES
  # ============================================================
  /leads/api/activities:
    get:
      summary: List activities
      description: >
        List activity records for contacts or companies.
        Activities track events like messages sent, emails opened,
        pipeline stage changes, and more.


        **Known activity types:**
        `pipeline_stage_changed`, `linkedin_message_sent`,
        `linkedin_message_replied`, `linkedin_connection_request_sent`,
        `linkedin_connection_request_accepted`, `email_sent`,
        `email_replied`, `email_opened`, `email_clicked`,
        `email_bounced`, `contact_enriched`.


        Filter by type and date range to narrow results. The `payload`
        field contains event-specific data (e.g. `flow_origin`,
        `flow_uuid`, pipeline stage UUIDs).
      operationId: listActivities
      tags:
        - Activities
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/order-field'
        - $ref: '#/components/parameters/order-type'
        - in: query
          name: filter
          required: true
          schema:
            type: string
          description: >
            JSON string with filter criteria. Supported keys:

            - `type` — activity type (e.g. `"pipeline_stage_changed"`)

            - `lead_uuid` — filter by contact UUID

            - `company_uuid` — filter by company UUID

            - `created_at` — date filter with operators (`{">=": "2026-01-01"}`)

            Example: `?filter={"type":"pipeline_stage_changed","created_at":{">=":"2026-04-01"}}`
      responses:
        '200':
          description: List of activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/activity'
    post:
      summary: Create an activity
      description: Create a new activity record for a contact or company.
      operationId: createActivity
      tags:
        - Activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_uuid, object_type, type]
              properties:
                object_uuid:
                  type: string
                  description: UUID of the contact or company.
                object_type:
                  type: string
                  enum: [lead, company]
                type:
                  type: string
                  description: "Activity type (e.g. `linkedin_message_sent`, `email_sent`)."
                  example: linkedin_message_sent
                payload:
                  type: object
                  additionalProperties: true
                  description: Activity-specific data.
      responses:
        '201':
          description: Activity created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity'
  # ============================================================
  # BLACKLIST
  # ============================================================
  /leads/api/leads-blacklist:
    get:
      summary: List blacklisted contacts
      description: >
        Returns blacklisted contact entries for the team. Blacklisted contacts
        are excluded from imports, enrichment, automations, and mass actions.
      operationId: listLeadsBlacklist
      tags:
        - Blacklist
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated list of blacklisted contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/lead-blacklist-entry'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  has_more:
                    type: boolean
    post:
      summary: Add contact to blacklist
      description: >
        Blacklist a contact by LinkedIn handle, email, name, or company name.
        Provide at least one identifier; the entry is matched on import and outreach.
      operationId: addLeadToBlacklist
      tags:
        - Blacklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkedin:
                  type: string
                  description: LinkedIn profile handle.
                  example: john-doe-123456
                email:
                  type: string
                  format: email
                name:
                  type: string
                company_name:
                  type: string
              anyOf:
                - required: [linkedin]
                - required: [email]
                - required: [name]
            example:
              linkedin: john-doe-123456
      responses:
        '201':
          description: Contact blacklisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lead-blacklist-entry'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/leads-blacklist/{uuid}:
    delete:
      summary: Remove contact from blacklist
      description: Delete a blacklist entry by its UUID.
      operationId: deleteLeadBlacklistEntry
      tags:
        - Blacklist
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Entry removed.
        '404':
          description: Entry not found.
  /leads/api/companies-blacklist:
    get:
      summary: List blacklisted companies
      description: >
        Returns blacklisted company entries for the team. Blacklisted companies
        are excluded from imports, enrichment, automations, and mass actions.
      operationId: listCompaniesBlacklist
      tags:
        - Blacklist
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated list of blacklisted companies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/company-blacklist-entry'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  has_more:
                    type: boolean
    post:
      summary: Add company to blacklist
      description: >
        Blacklist a company by LinkedIn handle, domain, or name.
        Provide at least one identifier; the entry is matched on import and outreach.
      operationId: addCompanyToBlacklist
      tags:
        - Blacklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkedin:
                  type: string
                  description: LinkedIn company handle.
                  example: acme-inc
                domain:
                  type: string
                  example: acme.com
                name:
                  type: string
                  example: Acme Inc
              anyOf:
                - required: [linkedin]
                - required: [domain]
                - required: [name]
            example:
              domain: spammer.com
      responses:
        '201':
          description: Company blacklisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company-blacklist-entry'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/companies-blacklist/{uuid}:
    delete:
      summary: Remove company from blacklist
      description: Delete a blacklist entry by its UUID.
      operationId: deleteCompanyBlacklistEntry
      tags:
        - Blacklist
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Entry removed.
        '404':
          description: Entry not found.
