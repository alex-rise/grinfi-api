        Retrieve all contact lists in your account. Lists are used to organize
        contacts into groups for outreach campaigns.
      operationId: listLists
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/order-field'
        - $ref: '#/components/parameters/order-type'
        - in: query
          name: filter
          schema:
            type: object
            properties:
              q:
                type: string
                nullable: true
                description: Search by list name.
              uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              name:
                $ref: '#/components/schemas/mixed-filter-type'
      responses:
        '200':
          description: List of contact lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/list'
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 12
    post:
      summary: Create a list
      description: Create a new contact list.
      operationId: createList
      tags:
        - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Name for the new list.
                  example: CMO Germany
            example:
              name: CMO Germany
      responses:
        '201':
          description: List created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list'
  /leads/api/lists/{uuid}:
    get:
      summary: Get a list
      description: Retrieve details of a specific contact list.
      operationId: getList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: List details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list'
        '404':
          description: List not found.
    put:
      summary: Update a list
      description: Rename an existing contact list.
      operationId: updateList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Updated List Name
      responses:
        '200':
