      operationId: updateMailbox
      tags:
        - Mailboxes
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sender_name:
                  type: string
                automation_daily_limit:
                  type: integer
                automation_task_interval:
                  type: integer
