openapi: 3.0.3
info:
  title: Grinfi.io API
  description: >
    Complete API reference for Grinfi.io — the all-in-one LinkedIn & email outreach platform.

    Use this API to manage your CRM contacts, run outreach automations, send messages,
    and integrate Grinfi with your own tools.


    ## Authentication

    All requests require a Bearer token in the `Authorization` header.

    1. Log in at [leadgen.grinfi.io](https://leadgen.grinfi.io/)

    2. Go to [Settings → API Keys](https://leadgen.grinfi.io/settings/api-keys)

    3. Copy your key and pass it as:
       ```
       Authorization: Bearer YOUR_API_KEY
       ```


    ## Pagination

    List endpoints support `limit` (default 20) and `offset` (default 0) query parameters.
    Responses include `total` count and `has_more` boolean.


    ## Filtering

    Most list endpoints accept a `filter` object. Supported value types:

    | Type | Example | SQL equivalent |
    |------|---------|----------------|
    | Scalar | `"status": "ok"` | `= 'ok'` |
    | Array | `"status": ["ok", "pending"]` | `IN ('ok', 'pending')` |
    | Object | `"created_at": {">=": "2024-01-01"}` | `>= '2024-01-01'` |
    | `"is_null"` | `"email": "is_null"` | `IS NULL` |
    | `"is_not_null"` | `"email": "is_not_null"` | `IS NOT NULL` |

    Supported operators: `=`, `!=`, `<`, `<=`, `>`, `>=`, `<>`


    ## Rate Limits

    API requests are rate-limited to **300 requests per minute** per API key.
    If you exceed the limit, you'll receive a `429` response.
    Use exponential backoff when retrying.


    ## Contact Deduplication

    When creating contacts via upsert, the system checks for duplicates
    using the following field priority (first match wins):

    1. `ln_member_id` (LinkedIn member ID)

    2. `ln_id` (LinkedIn public ID)

    3. `sn_id` (Sales Navigator ID)

    4. LinkedIn nickname

    5. `work_email`

    6. `personal_email`

    7. `name` + `company_name` combination
  version: 2.0.0
  contact:
    name: Grinfi.io Support
    url: https://grinfi.io
    email: support@grinfi.io
  license:
    name: Copyright
    url: https://grinfi.io/terms
