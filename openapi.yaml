  # LINKEDIN MESSAGES
  # ============================================================
  /flows/api/linkedin-conversations:
    get:
      summary: List LinkedIn conversations
      description: >
        List LinkedIn conversation threads synced for the team. A conversation belongs to a
        **LinkedIn account and a contact** — not to an automation.


        **There is no `flow_uuid` filter here.** A contact can be touched by several
        automations, so conversations are not attributed to one. Passing a flat
        `?flow_uuid=` is silently ignored (you get every conversation back), and
        `filter[flow_uuid]` is rejected. For per-automation reporting use
        [`GET /flows/api/tasks`](#operation/listTasks), whose records do carry `flow_uuid`.
      operationId: listLinkedinConversations
      tags:
        - Messaging
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - in: query
          name: filter
          style: deepObject
          explode: true
          description: Filters, passed as `filter[field]=value`.
          schema:
            type: object
            properties:
              linkedin_account_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              lead_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
      responses:
        '200':
          description: Paginated list of conversations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/linkedin-conversation'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  has_more:
                    type: boolean
  /flows/api/linkedin-messages:
    get:
      summary: List LinkedIn messages
      description: >
        Retrieve LinkedIn messages from your unified inbox. Filter by contact,
        sender profile, conversation, message type (inbox/outbox), and status.
