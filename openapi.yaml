                    - csv_leads
                    - sn_leads_search
                    - sn_leads_saved_search
                    - sn_leads_list
                    - sn_accounts_search
                    - sn_accounts_saved_search
                    - sn_accounts_list
                    - ln_leads_search
                    - ln_accounts_search
                    - ln_my_network
                    - ln_my_messenger
                    - post_engagement
                    - recruiter_leads_search
                  example: sn_leads_search
                list_uuid:
                  type: string
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                payload:
                  type: object
                  description: Import configuration specific to the data source type.
                tags:
                  type: array
                  nullable: true
                  items:
                    type: string
      responses:
        '201':
          description: Data source created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data-source'
  /leads/api/data-sources/{uuid}:
    get:
      summary: Get a data source
      operationId: getDataSource
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Data source details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data-source'
    put:
      summary: Update a data source
      operationId: updateDataSource
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                list_uuid:
                  type: string
                payload:
                  type: object
                tags:
                  type: array
                  nullable: true
                  items:
                    type: string
      responses:
        '200':
          description: Data source updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data-source'
    delete:
      summary: Delete a data source
      operationId: deleteDataSource
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Data source deleted.
  /leads/api/data-sources/metrics:
    put:
      summary: Get data source metrics
      description: >
        Return per-data-source counts of queued, saved, duplicate, blacklisted, and error
        records. Pass an array of data source UUIDs in `uuids`. The response is a map
        keyed by UUID.
      operationId: getDataSourceMetrics
      tags:
        - Data Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuids]
              properties:
                uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  example:
                    - 6df2d07d-36dc-4401-81e2-7d6bd5075214
            example:
              uuids:
                - 6df2d07d-36dc-4401-81e2-7d6bd5075214
      responses:
        '200':
          description: Per-data-source metrics, keyed by UUID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    queued_records:
                      type: integer
                    saved_records:
                      type: integer
                    duplicate_records:
                      type: integer
                    blacklisted_records:
                      type: integer
                    error_records:
                      type: integer
                    child_queued_records:
                      type: integer
                    child_saved_records:
                      type: integer
                    child_duplicate_records:
                      type: integer
              example:
                6df2d07d-36dc-4401-81e2-7d6bd5075214:
                  queued_records: 0
                  saved_records: 0
                  duplicate_records: 0
                  blacklisted_records: 0
                  error_records: 0
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  # ============================================================
  # FILE OPERATIONS
  # ============================================================
  /leads/api/file-imports/upload-csv:
    post:
      summary: Upload a CSV file
      description: >
        Upload a CSV file to be imported as contacts or companies. Returns a file-import
        record with a UUID. Pass that UUID to `import-leads` or `import-companies` to
        actually create the records.


        **Note:** the only validated `type` value at the time of writing is `csv_leads`.
        Companies CSV may require a different mechanism — check with support.
      operationId: uploadCsvFile
      tags:
        - File Operations
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with header row.
                type:
                  type: string
                  description: Source type. Currently only `csv_leads` is accepted.
                  enum:
                    - csv_leads
                  example: csv_leads
      responses:
        '200':
          description: File import record created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  team_id:
                    type: integer
                  type:
                    type: string
                  payload:
                    type: object
                    description: Includes file path, delimiter, enclosure, and config.
                  status:
                    type: string
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/file-imports/{uuid}/import-leads:
    post:
      summary: Import contacts from uploaded file
      description: >
        Trigger contact import from a previously uploaded CSV file. Required field:
        `columns` — an ordered list of column-mapping objects describing how to map
        CSV columns to contact fields.
      operationId: importLeadsFromFile
      tags:
        - File Operations
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: array
                  description: Ordered list of column mappings (one per CSV column).
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        description: CSV column header.
                      target:
                        type: string
                        description: Contact field to map to.
                  example:
                    - source: first_name
                      target: first_name
                    - source: email
                      target: email
                list_uuid:
                  type: string
                  format: uuid
                  description: Optional list to add imported contacts to.
                tags:
                  type: array
                  description: Optional tag UUIDs to apply to imported contacts.
                  items:
                    type: string
                    format: uuid
            example:
              columns:
                - source: first_name
                  target: first_name
                - source: email
                  target: email
              list_uuid: 5322e0f5-7135-4eb5-b1c4-7805e832fe2f
      responses:
        '200':
          description: Import job started.
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/file-imports/{uuid}/import-companies:
    post:
      summary: Import companies from uploaded file
      description: Trigger company import from a previously uploaded CSV file.
      operationId: importCompaniesFromFile
      tags:
        - File Operations
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: array
                  description: Ordered list of column mappings.
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      target:
                        type: string
            example:
              columns:
                - source: name
                  target: name
                - source: domain
                  target: domain
      responses:
        '200':
          description: Import job started.
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/file-exports/leads:
    post:
      summary: Export contacts to CSV
      description: >
        Queue a CSV export of contacts matching the filter. Returns a file-export
        record with status `queued`. Once the job completes, use `download` to
        retrieve the file.
      operationId: exportLeadsToCsv
      tags:
        - File Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter]
              properties:
                filter:
                  type: object
                  description: 'Filter to select contacts. Use `{all: true}` to export everything.'
                  example:
                    all: true
            example:
              filter:
                all: true
      responses:
        '200':
          description: Export queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  team_id:
                    type: integer
                  type:
                    type: string
                    example: contact_export_csv
                  filter:
                    type: object
                  status:
                    type: string
                    example: queued
        '422':
          description: Validation error — `filter` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/file-exports/companies:
    post:
      summary: Export companies to CSV
      description: Queue a CSV export of companies matching the filter.
      operationId: exportCompaniesToCsv
      tags:
        - File Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter]
              properties:
                filter:
                  type: object
                  example:
                    all: true
            example:
              filter:
                all: true
      responses:
        '200':
          description: Export queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  type:
                    type: string
                    example: account_export_csv
                  status:
                    type: string
                    example: queued
        '422':
          description: Validation error — `filter` is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /leads/api/file-exports/download:
    post:
      summary: Download an exported file
      description: >
        Retrieve a previously generated export file by name. The `file_name`
        is returned as part of the export record once the job completes.
      operationId: downloadExportFile
      tags:
        - File Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name]
              properties:
                file_name:
                  type: string
                  description: File name from the export record.
                  example: leads-export-2026-04-28.csv
      responses:
        '200':
          description: File contents (CSV).
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
        '422':
