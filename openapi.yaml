  # ============================================================
  # AI TEMPLATES
  # ============================================================
  /flows/api/ai-templates:
    get:
      summary: List AI Templates
      description: List all AI templates (reusable AI-driven message snippets) for the team.
      operationId: listAiTemplates
      tags:
        - AI Templates
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated list of AI templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ai-template'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  has_more:
                    type: boolean
    post:
      summary: Create an AI Template
      description: >
        Create a reusable message template. Templates are referenced from flow nodes by
        their `uuid` (the `template_uuid` field on `linkedin_send_message`,
        `email_send_message`, etc.).


        **`is_public` is required** — sending the request without it currently returns a
        `500` instead of a validation error, so always include it (`1` = shared with the
        team, `0` = private). `name` and `type` are also required; everything else is
        optional and defaults to empty.
      operationId: createAiTemplate
      tags:
        - AI Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, is_public]
              properties:
                name:
                  type: string
                  example: Cold outreach — CTO
                type:
                  type: string
                  description: Template type.
                  enum: [message, connection_note, email, post_comment]
                  example: message
                is_public:
                  type: integer
                  description: "`1` = visible to the whole team, `0` = private. Required (see note above)."
                  enum: [0, 1]
                  example: 1
                subject:
                  type: string
                  nullable: true
                  description: Subject line (for `email` templates).
                body:
                  type: string
                  nullable: true
                  description: Template body. Supports `{{variables}}` (e.g. `{{first_name}}`).
                prompt:
                  type: string
                  nullable: true
                  description: AI personalization prompt.
                llm_uuid:
                  type: string
                  format: uuid
                  nullable: true
                  description: LLM integration to use for AI blocks.
                llm_config:
                  type: object
                  nullable: true
                enable_validation:
                  type: boolean
                enable_fallback:
                  type: boolean
                settings:
                  type: object
            example:
              name: Cold outreach — CTO
              type: message
              is_public: 1
              body: "Hi {{first_name}}, saw you lead engineering at {{company}} — worth a chat?"
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ai-template'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /flows/api/ai-templates/{uuid}:
    get:
      summary: Get an AI Template
      description: Retrieve a single AI template by UUID, including its prompt and LLM config.
      operationId: getAiTemplate
      tags:
        - AI Templates
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: AI template details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ai-template'
        '404':
          description: Not found.
    put:
      summary: Update an AI Template
      description: Update fields on an existing AI template.
      operationId: updateAiTemplate
      tags:
        - AI Templates
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                subject:
                  type: string
                  nullable: true
                body:
                  type: string
                  nullable: true
                prompt:
                  type: string
                  nullable: true
                llm_uuid:
                  type: string
                  format: uuid
                  nullable: true
                llm_config:
                  type: object
                  nullable: true
                enable_validation:
                  type: boolean
                enable_fallback:
                  type: boolean
                settings:
                  type: object
            example:
              name: Cold outreach v2
      responses:
        '200':
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ai-template'
        '404':
          description: Not found.
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      summary: Delete an AI Template
      description: >
        Delete an AI template. Returns `204`; the deletion takes effect (the template
        disappears from the web app).


        **Known issue:** deletion appears to be a soft-delete that the API read path does
        not filter — after deleting, the template still resolves on
        `GET /flows/api/ai-templates/{uuid}` and still appears in `List AI Templates`,
        even though it is gone from the UI (verified 2026-07-05). Treat a template as
        deleted once you receive the `204`; don't rely on `List`/`GET` to confirm removal.
        See `KNOWN_ISSUES.md`.
      operationId: deleteAiTemplate
      tags:
        - AI Templates
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Deleted.
        '404':
          description: Not found.
  /flows/api/ai-templates/render:
    post:
      summary: Render an AI Template
      description: >
        Render a template for a specific contact and sender profile. The simplest
        usage is to pass an existing template `uuid` along with `lead_uuid` and
        `sender_profile_uuid` — the saved template configuration is used.


        For ad-hoc rendering without a saved template, pass the full set of fields
        (subject, body, type, llm_uuid, llm_config, prompt, enable_validation,
        enable_fallback, settings).
      operationId: renderAiTemplate
      tags:
        - AI Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_uuid, sender_profile_uuid]
              properties:
                uuid:
                  type: string
                  format: uuid
                  description: Existing template UUID. If provided, other fields default from saved template.
                lead_uuid:
                  type: string
                  format: uuid
                sender_profile_uuid:
                  type: string
                  format: uuid
                subject:
                  type: string
                body:
                  type: string
                type:
                  type: string
                llm_uuid:
                  type: string
                  format: uuid
                llm_config:
                  type: object
                prompt:
                  type: string
                enable_validation:
                  type: boolean
                enable_fallback:
                  type: boolean
                settings:
                  type: object
            example:
              uuid: ace0258f-c311-4af4-9abd-6b4f4907adc7
              lead_uuid: 02dcb6ac-9b15-49f6-8882-fbca91e986ab
              sender_profile_uuid: b290a1be-8131-423d-94eb-8dda4fef0017
      responses:
        '200':
          description: Rendered template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm_instructions:
                    type: string
                    nullable: true
                  rendered_body:
                    type: string
                    nullable: true
                  ai_generated_body:
                    type: string
                    nullable: true
                  fallback_body:
                    type: string
                    nullable: true
                  handling_error:
                    type: string
                    nullable: true
                  validation_history:
                    type: array
                    items:
                      type: object
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  # ============================================================
  # EMAILS
  # ============================================================
  /emails/api/emails:
    get:
      summary: List emails
      description: >
        Retrieve emails from your unified inbox. Filter by contact, mailbox, automation
        (`flow_uuid`), type (`inbox`/`outbox`), status, and date range.


        Filters use the **`filter[...]`** form (URL-encode the brackets); flat params are
        ignored. Read `total` with `limit=1` to count without paging.


        **Reporting on email sent per campaign:** unlike LinkedIn messages, emails carry
        `flow_uuid`, so email volume can be counted per automation. Note that `type=outbox`
        includes emails **synced from the mailbox** (`status=sync`) as well as those
        **sent by an automation** (`status=sent`) — filter `status=sent` (or a non-empty
        `flow_uuid`) to count only what Grinfi sent. Date range uses `sent_at` operators,
        e.g. `filter[sent_at][>=]=2026-07-01`.


        There is no `group-counts` endpoint for emails — build breakdowns by issuing one
        filtered count per slice (by `flow_uuid`, `mailbox_uuid`, date, …).
      operationId: listEmails
      tags:
        - Emails
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/order-field'
        - $ref: '#/components/parameters/order-type'
        - in: query
          name: filter
          style: deepObject
          explode: true
          description: Filters, passed as `filter[field]=value`.
          schema:
            type: object
            properties:
              flow_uuid:
                description: Automation the email belongs to (empty for mailbox-synced mail).
                allOf:
                  - $ref: '#/components/schemas/mixed-filter-type'
              flow_node_id:
                type: integer
                description: Node in the flow tree that produced the email.
              mailbox_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              lead_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              type:
                description: "`outbox` (sent) or `inbox` (received)."
                allOf:
                  - $ref: '#/components/schemas/mixed-filter-type'
              status:
                description: "e.g. `sent` (sent by automation), `sync` (synced from mailbox)."
                allOf:
                  - $ref: '#/components/schemas/mixed-filter-type'
              sent_at:
                description: "Date/time sent. Use operators for ranges, e.g. `filter[sent_at][>=]=2026-07-01`."
                allOf:
                  - $ref: '#/components/schemas/mixed-filter-type'
              from_email:
                $ref: '#/components/schemas/mixed-filter-type'
              to_email:
                $ref: '#/components/schemas/mixed-filter-type'
              thread_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              template_uuid:
                $ref: '#/components/schemas/mixed-filter-type'
              folder:
                $ref: '#/components/schemas/mixed-filter-type'
      responses:
        '200':
          description: List of emails.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/email'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
  /emails/api/emails/{uuid}:
    get:
      summary: Get an email
      description: Retrieve full details of an email by UUID.
      operationId: getEmail
      tags:
        - Emails
      parameters:
