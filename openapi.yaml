          description: Automation folder deleted.
  /flows/api/flows/metrics:
    post:
      summary: Get automation metrics
      description: >
        Retrieve current-state metrics for one or more automations: contact counts and the
        **pending task queue** per automation UUID.


        **`task_counts` is queue depth, not sent volume.** It counts tasks still waiting to
        run (status `in_progress`) per task type — it does **not** count what has been sent.
        Verified against `List tasks`: for four automations the `task_counts` values matched
        `filter[status]=in_progress` exactly, while actual sent volume
        (`filter[status]=closed`) was 5–250× higher.


        For "how many were actually sent" — and for anything scoped to a date range — use
        [`GET /flows/api/tasks`](#operation/listTasks) with
        `filter[status]=closed` and a `filter[executed_at]` range. This endpoint has no date
        filter; its numbers are always current-state.
      operationId: getFlowMetrics
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuids]
              properties:
                uuids:
                  type: array
                  description: List of automation UUIDs.
                  items:
                    type: string
            example:
              uuids:
                - e0280f7c-c2e9-4aec-a6bc-bc17ef028740
      responses:
        '200':
          description: >
            Metrics keyed by automation UUID. Each entry contains contact
            counts and task counts broken down by task type.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    leads_count:
                      type: integer
                      description: Total contacts added to this automation.
                    in_progress_leads_count:
                      type: integer
                      description: Contacts currently in progress.
                    finished_leads_count:
                      type: integer
                      description: Contacts that completed the sequence.
                    failed_leads_count:
                      type: integer
                      description: Contacts that failed.
                    task_counts:
                      type: object
                      description: >
                        **Pending** tasks keyed by type — i.e. still queued to run
                        (equivalent to `List tasks` with `filter[status]=in_progress`).
                        This is queue depth, **not** how many were sent. For sent volume
                        use [`listTasks`](#operation/listTasks) with
                        `filter[status]=closed`.
                      additionalProperties:
                        type: integer
              example:
                e0280f7c-c2e9-4aec-a6bc-bc17ef028740:
                  leads_count: 150
                  in_progress_leads_count: 42
                  finished_leads_count: 95
                  failed_leads_count: 13
                  task_counts:
                    linkedin_send_connection_request: 42
                    email_send_message: 17
