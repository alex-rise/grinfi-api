                  type: object
                  properties:
                    smtp_host:
                      type: string
                    smtp_port:
                      type: integer
                    smtp_username:
                      type: string
                    smtp_password:
                      type: string
                    imap_host:
                      type: string
                    imap_port:
                      type: integer
                    imap_username:
                      type: string
                    imap_password:
                      type: string
                automation_daily_limit:
                  type: integer
                  example: 50
                automation_task_interval:
                  type: integer
                  example: 120
      responses:
        '201':
          description: Mailbox created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mailbox'
  /emails/api/mailboxes/{uuid}:
    get:
      summary: Get a mailbox
      description: Retrieve details of a specific mailbox.
      operationId: getMailbox
      tags:
        - Mailboxes
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Mailbox details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mailbox'
        '404':
          description: Not found.
    put:
      summary: Update a mailbox
