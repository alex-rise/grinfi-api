  # ============================================================
  # WEBHOOKS
  # ============================================================
  /integrations/api/webhooks:
    get:
      summary: List webhooks
      description: >
        List all webhooks configured in your account. Webhooks send HTTP
        requests to your target URL when specified events occur.
      operationId: listWebhooks
      tags:
        - Webhooks
      responses:
        '200':
          description: List of webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/webhook'
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 3
                  has_more:
                    type: boolean
    post:
      summary: Create a webhook
      description: >
        Create a new webhook that fires on the specified event. Optionally
        add filters to narrow which contacts trigger the webhook.
      operationId: createWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event, target_url]
              properties:
                name:
                  type: string
                  description: Human-readable label.
                  example: New Reply Handler
                event:
                  type: string
                  description: >
                    Event that triggers the webhook.


                    **Sender-profile actions** (something was sent):
                    `sender_profile_sent_email`, `sender_profile_sent_linkedin_message`,
                    `sender_profile_sent_linkedin_connection_request`,
                    `sender_profile_sent_linkedin_inmail`.


                    **Contact events**: `contact_accepted_linkedin_connection_request`,
                    `contact_replied_email`, `contact_replied_linkedin_message`,
                    `contact_replied_linkedin_inmail`, `contact_opened_email`,
                    `contact_clicked_email`, `contact_unsubscribed_email`, `email_bounced`,
                    `contact_enriched`, `contact_exported`, `contact_created`,
                    `contact_updated`, `contact_deleted`, `contact_tag_added`,
                    `contact_pipeline_stage_changed`.


                    See the [`webhook-payload`](#schema/webhook-payload) schema for the
                    body delivered to your `target_url`.
                  enum:
                    - sender_profile_sent_email
                    - sender_profile_sent_linkedin_message
                    - sender_profile_sent_linkedin_connection_request
                    - sender_profile_sent_linkedin_inmail
                    - contact_accepted_linkedin_connection_request
                    - contact_replied_email
                    - contact_replied_linkedin_message
                    - contact_replied_linkedin_inmail
                    - contact_opened_email
                    - contact_clicked_email
                    - contact_unsubscribed_email
                    - email_bounced
                    - contact_enriched
                    - contact_exported
                    - contact_created
                    - contact_updated
                    - contact_deleted
                    - contact_tag_added
                    - contact_pipeline_stage_changed
                  example: sender_profile_sent_email
                request_method:
                  type: string
                  description: HTTP method for the outgoing request.
                  enum: [POST, GET, PUT, PATCH, DELETE]
                  default: POST
                  example: POST
                target_url:
                  type: string
                  format: uri
                  description: URL that will receive the webhook payload.
                  example: https://hook.eu2.make.com/abc123
                filters:
                  type: object
                  nullable: true
                  description: >
                    Optional filter object to narrow which contacts trigger
                    the webhook. Uses a tree-based filter format with
                    `jsonLogic` and `filter_tree_format` keys.
                status:
                  type: string
                  enum: ['on', 'off']
                  default: 'on'
            example:
              name: New Reply Handler
              event: contact_replied_linkedin_message
              request_method: POST
              target_url: https://hook.eu2.make.com/abc123
              status: 'on'
      responses:
        '201':
          description: Webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhook'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      callbacks:
        event:
          '{$request.body#/target_url}':
            post:
              summary: Event delivery to your target_url
              description: When the subscribed event fires, Grinfi sends this payload to your `target_url`.
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/webhook-payload'
              responses:
                '2XX':
                  description: Return any 2xx to acknowledge receipt.
  /integrations/api/webhooks/{uuid}:
    get:
      summary: Get a webhook
      description: Retrieve full details of a webhook by UUID.
      operationId: getWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '200':
          description: Webhook details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhook'
        '404':
          description: Webhook not found.
    put:
      summary: Update a webhook
      description: >
        Update one or more fields on an existing webhook. Only include the
        fields you want to change.
      operationId: updateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                event:
                  type: string
                  enum:
                    - contact_replied_email
                    - contact_replied_linkedin_message
                    - contact_exported
                    - contact_enriched
                request_method:
                  type: string
                  enum: [POST, GET, PUT, PATCH, DELETE]
                target_url:
                  type: string
                  format: uri
                filters:
                  type: object
                  nullable: true
                status:
                  type: string
                  enum: ['on', 'off']
      responses:
        '200':
          description: Webhook updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhook'
        '404':
          description: Webhook not found.
        '422':
          description: Validation error.
    delete:
      summary: Delete a webhook
      description: Permanently remove a webhook.
      operationId: deleteWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Webhook deleted.
        '404':
          description: Webhook not found.
  /integrations/api/webhooks/test:
    post:
      summary: Test a webhook
      description: >
        Send a sample payload for the given event to a target URL and return the target's
        response — use it to verify connectivity and see the payload shape for an event.


        **Send the full webhook config**, not just the `uuid`: `event`, `request_method`
        and `target_url` are all required (sending `uuid` alone returns a 422). The sample
        payload uses placeholder data and matches the [`webhook-payload`](#schema/webhook-payload)
        schema.
      operationId: testWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, event, request_method, target_url]
              properties:
                uuid:
                  type: string
                  description: UUID of the webhook to test.
                event:
                  type: string
                  description: Event whose sample payload to send (see `createWebhook` for values).
                  example: sender_profile_sent_email
                request_method:
                  type: string
                  enum: [POST, GET, PUT, PATCH, DELETE]
                  example: POST
                target_url:
                  type: string
                  format: uri
                  example: https://your-endpoint.com/hook
            example:
              uuid: b27f3cfc-84a0-4fb8-956b-91d032f9c523
              event: sender_profile_sent_email
              request_method: POST
              target_url: https://your-endpoint.com/hook
      responses:
        '200':
          description: Test payload sent. Returns the target response.
        '404':
          description: Webhook not found.
# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        API key from [Settings -> API Keys](https://leadgen.grinfi.io/settings/api-keys).
  schemas:
    error:
      type: object
      description: >
        Error response envelope. Validation errors include field-level
        details in `error.data`.
      properties:
        error:
          type: object
          properties:
            reason:
              type: string
              description: >
                Machine-readable error code: `validation_error`, `bad_request`,
                `auth_exception`, `access_denied`, `payment_required`.
              example: validation_error
            message:
              type: string
              example: The name field is required.
            data:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Field-level validation errors (field name → messages).
        message:
          type: string
          example: The given data was invalid.
        code:
          type: integer
          example: 422
    lead:
      type: object
      description: A contact (lead) in your CRM.
      properties:
        uuid:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        team_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        sender_profile_uuid:
          type: string
          nullable: true
        list_uuid:
          type: string
        data_source_uuid:
          type: string
          nullable: true
