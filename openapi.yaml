        Pass `null` as value to clear the field.
      operationId: upsertCustomFieldValue
      tags:
        - Custom Fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [custom_field_uuid, object_type, object_uuid]
              properties:
