  # ============================================================
  # PIPELINE
  # ============================================================
  /leads/api/pipeline-stages:
    get:
      summary: List pipeline stages
      description: >
        Retrieve all pipeline stages. Use the `filter` parameter (JSON string)
        to narrow results by object type or stage type.
      operationId: listPipelineStages
      tags:
        - Pipeline
      parameters:
        - in: query
          name: filter
          required: true
          schema:
            type: string
          description: >
            JSON string with filter criteria. Supported keys:

            - `object` — `"lead"` or `"company"` (required)

            - `type` — `"custom"`, `"new"`, `"approaching"`, `"engaging"`, `"replied"`

            Example: `?filter={"object":"lead"}`
      responses:
        '200':
          description: List of pipeline stages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/pipeline-stage'
    post:
      summary: Create a pipeline stage
      description: Create a new custom pipeline stage.
      operationId: createPipelineStage
      tags:
        - Pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, object, category]
              properties:
                name:
                  type: string
                  example: Demo Booked
                object:
                  type: string
                  enum: [lead, company]
                  example: lead
                category:
                  type: string
                  enum: [cold, engaging, positive, negative]
                  description: Visual category for the stage.
                  example: positive
                order:
                  type: integer
                  description: Display order.
                  example: 5
      responses:
        '201':
          description: Stage created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-stage'
  /leads/api/pipeline-stages/{uuid}:
    put:
      summary: Update a pipeline stage
      description: Update a pipeline stage's name, category, or order.
      operationId: updatePipelineStage
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                  enum: [cold, engaging, positive, negative]
                order:
                  type: integer
      responses:
        '200':
          description: Updated stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-stage'
    delete:
      summary: Delete a pipeline stage
      description: Delete a custom pipeline stage.
      operationId: deletePipelineStage
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/uuid-path'
      responses:
        '204':
          description: Stage deleted.
