    node-edge:
      type: object
      description: >
        A directed edge between two nodes in the flow tree. Appears in a node's
        `before` (incoming) and `after` (outgoing) arrays.
      required: [node_id, branch_id]
      properties:
        node_id:
          type: integer
          description: ID of the node on the other end of this edge.
          example: 5
        branch_id:
          type: integer
          description: >
            Which branch this edge belongs to. For linear steps use `1`. For branching
            nodes: `rule_ab_test` uses `1`/`2` (A/B); `rule_filter` uses `1` for the
            "match" branch and `0` for the "else" branch; triggers use `1`/`2`.
          example: 1
    flow-node:
      type: object
      description: >
        A single step in an automation's node tree. Nodes are linked into a graph by the
        `before`/`after` edge arrays rather than by array order. Every branch must
        terminate in an `end` node (a flow can have more than one).


        `automation` is always the string `"auto"`; the step's real configuration lives in
        `payload`, whose shape depends on `type`. Nodes with no configuration
        (`linkedin_visit_profile`, `linkedin_like_latest_post`, `end`) use an empty array
        `[]` as their payload.


        **Node types and their `payload`:**


        | `type` | Category | `payload` shape |
        | --- | --- | --- |
        | `trigger_message_replied` | trigger (entry) | `{ subtasks: [util_timer node], check_period_type: "last_response" }` |
        | `trigger_linkedin_connection_request_accepted` | trigger (entry) | `{ subtasks: [util_timer node] }` |
        | `linkedin_send_connection_request` | action | `{ template, fallback_send: bool, template_uuid }` |
        | `linkedin_send_message` | action | `{ template, attachments: [], template_uuid, stop_on_reply_level: "always" }` |
        | `linkedin_send_inmail` | action | `{ subject, template, attachments: [], template_uuid, stop_on_reply_level }` |
        | `linkedin_visit_profile` | action | `[]` |
        | `linkedin_like_latest_post` | action | `[]` |
        | `linkedin_endorse_skills` | action | `{ number: int }` |
        | `linkedin_withdraw_connection_request` | action | `{ note, withdraw_key }` |
        | `email_send_message` | action | `{ subject, template, add_history: 0\|1, attachments: [], email_field: "work_email", template_uuid, stop_on_reply_level }` |
        | `gs_add_tag` | action | `{ tag_uuid }` |
        | `gs_rotate_sender_profile` | action | `{ rotations: [{ contact_source_id }] }` |
        | `rule_ab_test` | branch | `{ branches: [{ value: 50, branch_id: 1, is_enabled: true }, { value: 50, branch_id: 2, is_enabled: true }] }` |
        | `rule_filter` | branch | `{ branches: [{ filters: { json_logic, filter_tree_format, mass_actions_filter }, branch_id: 1 }, { branch_id: 0 }] }` |
        | `util_timer` | delay | `{ wait_time: seconds }` |
        | `end` | terminal | `[]` |


        Use [`POST /flows/api/flow-versions/validate-node`](#operation/validateFlowNode)
        to check a single node before saving the whole tree.
      required: [id, type, before, after]
      properties:
        id:
          type: integer
          description: Node ID, unique within the flow version. Must be an integer.
          example: 3
        type:
          type: string
          description: Node type. See the table above for allowed values.
          example: linkedin_send_connection_request
        before:
          type: array
          description: Incoming edges (empty for entry nodes). Required, may be `[]`.
          items:
            $ref: '#/components/schemas/node-edge'
        after:
          type: array
          description: Outgoing edges (empty for the `end` node). Required, may be `[]`.
          items:
            $ref: '#/components/schemas/node-edge'
        automation:
          type: string
          description: Always the literal string `"auto"`.
          example: auto
        payload:
          description: >
            Node configuration. Object whose shape depends on `type` (see table), or `[]`
            for nodes with no configuration.
          oneOf:
            - type: object
            - type: array
          example:
            template: "Hi {{first_name}}, happy to connect!"
            fallback_send: true
            template_uuid: null
        delay_in_seconds:
          type: integer
          description: >
            Delay before this node runs, relative to the previous step (e.g. `7200` = 2h,
            `86400` = 1 day). `0` = run immediately.
          example: 0
        created_at:
          type: string
          format: date-time
          description: >
            **Required when saving a node via `createFlowVersion`** (an ISO-8601 timestamp;
            use the current time for new nodes). Not required by `validate-node`.
          example: "2026-07-05T10:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          description: Required alongside `created_at` when saving via `createFlowVersion`.
          example: "2026-07-05T10:00:00.000000Z"
