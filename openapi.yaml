                  type: string
                  description: UUID of the custom field.
                object_type:
                  type: string
                  enum: [lead, company]
                object_uuid:
                  type: string
                  description: UUID of the contact or company.
                value:
                  type: string
                  nullable: true
                  description: Field value, or null to clear.
                  example: Enterprise
