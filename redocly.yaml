apis:
  grinfi:
    root: ./openapi.yaml

extends:
  - recommended

rules:
  no-unused-components: warn
  no-server-example.com: off

theme:
  openapi:
    theme:
      hideMockServer: true
      colors:
        primary:
          main: "#06a408"
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: Node.js
        - lang: JavaScript
        - lang: Python
        - lang: PHP

feedback:
  hide: true

breadcrumbs:
  hide: true

mockServer:
  off: true

reunite:
  ignoreLint: true
  ignoreLinkChecker: true
  ignoreMarkdocErrors: true